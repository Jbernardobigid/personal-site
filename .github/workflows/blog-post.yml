name: Generate Blog Post

on:
  # Scheduled generation migrated to VPS n8n on 2026-06-17 ("Blog — Generate post (VPS)",
  # id oR7emRcppMc59frq, cron 0 9 */2 * * in America/Sao_Paulo = exactly 09:00 BRT).
  # Reason: GitHub Actions scheduled crons are queued best-effort and drifted 2-6h late.
  # The schedule trigger below is intentionally removed so the two pipelines don't
  # double-post. workflow_dispatch is kept as a manual break-glass fallback (the VPS
  # path is now the source of truth — see infra/vps/create-workflows.mjs).
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Force a specific pillar (black-identity, cycling, technology, entrepreneurship, fatherhood, learning, career-growth)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Validate pillar input
        if: ${{ github.event.inputs.pillar != '' }}
        run: |
          PILLAR="${{ github.event.inputs.pillar }}"
          ALLOWED="black-identity cycling technology entrepreneurship fatherhood learning career-growth"
          if ! echo "$ALLOWED" | grep -qw "$PILLAR"; then
            echo "Invalid pillar value: $PILLAR" >&2; exit 1
          fi

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PILLAR: ${{ github.event.inputs.pillar }}
        run: |
          if [ -n "$PILLAR" ]; then
            node generate-post.mjs --with-signals --pillar "$PILLAR"
          else
            node generate-post.mjs --with-signals
          fi

      - name: Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node post-to-linkedin.mjs

      - name: Commit and push new post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/   # covers posts/, posts/images/, and posts/research/
          if [ -f used-signals.json ]; then git add used-signals.json; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "blog: add auto-generated post ($(date +%Y-%m-%d))"
            git push
          fi
