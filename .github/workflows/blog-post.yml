name: Generate Blog Post

on:
  schedule:
    # Runs every 2 days at 09:00 UTC
    - cron: '0 9 */2 * *'
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Force a specific pillar (data-security, entrepreneurship, cycling, brand, wellness)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.pillar }}" ]; then
            node generate-post.mjs --pillar "${{ github.event.inputs.pillar }}"
          else
            node generate-post.mjs
          fi

      - name: Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node post-to-linkedin.mjs

      - name: Commit and push new post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ blog/posts/images/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "blog: add auto-generated post ($(date +%Y-%m-%d))"
            git push
          fi
