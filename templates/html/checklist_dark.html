<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,600;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body, html { margin: 0; padding: 0; }
    #slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
    }
    .bg-photo {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.35) saturate(0.7);
    }
    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 740px;
      background: #F4F0E8;
      border-radius: 4px;
      padding: 52px 56px 56px;
      box-sizing: border-box;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    }
    .card-label {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 20px;
      color: #8B5E3C;
      margin-bottom: 6px;
    }
    .card-headline {
      font-family: 'Montserrat', sans-serif;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1C2B1A;
      text-transform: uppercase;
      margin-bottom: 32px;
      line-height: 1.1;
    }
    .items-list { display: flex; flex-direction: column; gap: 0; }
    .item {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px 0;
      border-bottom: 1px solid rgba(28,43,26,0.12);
    }
    .item:last-child { border-bottom: none; }
    .item-prefix {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1C3A28;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #C8A96E;
      font-size: 13px;
      font-weight: 700;
    }
    .item-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      color: #2C2C2C;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div id="slide">
    <img class="bg-photo" src="{{PHOTO_URL}}" alt="">
    <div class="card">
      <div class="card-label">{{HEADLINE}}</div>
      <div class="card-headline">Para lembrar</div>
      <div class="items-list">{{ITEMS_HTML}}</div>
    </div>
  </div>
</body>
</html>
