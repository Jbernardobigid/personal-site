<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body, html { margin: 0; padding: 0; }
    #slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #6B3A1E;
      padding: 68px 80px 60px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    .top-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      margin-bottom: 14px;
    }
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-style: italic;
      font-size: 60px;
      line-height: 1.12;
      color: #EDE5D8;
      margin-bottom: 36px;
      letter-spacing: -0.5px;
    }
    .items-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }
    .item {
      background: rgba(237,229,216,0.1);
      border-left: 3px solid #C8A96E;
      padding: 16px 22px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      border-radius: 0 4px 4px 0;
    }
    .item-prefix {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 28px;
      color: #C8A96E;
      line-height: 1;
      flex-shrink: 0;
      min-width: 28px;
    }
    .item-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      line-height: 1.45;
      color: #EDE5D8;
      margin: 0;
    }
    .footer {
      margin-top: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .handle {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }
    .accent-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #C8A96E;
    }
  </style>
</head>
<body>
  <div id="slide">
    <div class="top-label">Dicas</div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="items-container">{{ITEMS_HTML}}</div>
    <div class="footer">
      <span class="handle">@jotabernardO</span>
      <div class="accent-dot"></div>
      <span class="handle">jotabernardo.com</span>
    </div>
  </div>
</body>
</html>
