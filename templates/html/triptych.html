<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body, html { margin: 0; padding: 0; }
    #slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #1C3A28;
      display: flex;
    }
    .left-col {
      width: 520px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 56px 72px 64px;
      box-sizing: border-box;
    }
    .accent {
      width: 40px;
      height: 3px;
      background: #C8A96E;
      margin-bottom: 32px;
    }
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 64px;
      line-height: 1.1;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 28px;
    }
    .body {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      line-height: 1.65;
      color: rgba(255,255,255,0.65);
    }
    .handle {
      margin-top: 40px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(200,169,110,0.55);
    }
    .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .photo-strip {
      flex: 1;
      overflow: hidden;
    }
    .photo-strip img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-strip:nth-child(1) img { object-position: center 10%; }
    .photo-strip:nth-child(2) img { object-position: center 50%; filter: brightness(0.88) saturate(0.9); }
    .photo-strip:nth-child(3) img { object-position: center 80%; filter: brightness(0.75) saturate(0.85); }
  </style>
</head>
<body>
  <div id="slide">
    <div class="left-col">
      <div class="accent"></div>
      <div class="headline">{{HEADLINE}}</div>
      <div class="body">{{BODY}}</div>
      <div class="handle">@jotabernardO</div>
    </div>
    <div class="right-col">
      <div class="photo-strip"><img src="{{PHOTO_URL}}" alt=""></div>
      <div class="photo-strip"><img src="{{PHOTO_URL}}" alt=""></div>
      <div class="photo-strip"><img src="{{PHOTO_URL}}" alt=""></div>
    </div>
  </div>
</body>
</html>
