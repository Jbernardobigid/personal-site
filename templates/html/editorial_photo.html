<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,600;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body, html { margin: 0; padding: 0; }
    #slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #EDE8DE;
    }
    .photo-zone {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 520px;
      overflow: hidden;
    }
    .photo-zone img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 25%;
      filter: brightness(0.82) saturate(0.9);
    }
    .text-zone {
      position: absolute;
      top: 520px;
      left: 0; right: 0; bottom: 0;
      padding: 40px 64px 48px;
      box-sizing: border-box;
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }
    .headline-col {
      flex-shrink: 0;
      width: 280px;
    }
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 52px;
      line-height: 1.1;
      color: #1C3A28;
      letter-spacing: -0.3px;
    }
    .body-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .body {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      line-height: 1.65;
      color: #3A3028;
    }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1C3A28;
      color: #C8A96E;
      border-radius: 40px;
      padding: 12px 24px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      width: fit-content;
    }
    .handle {
      position: absolute;
      bottom: 20px;
      right: 44px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(28,58,40,0.3);
    }
  </style>
</head>
<body>
  <div id="slide">
    <div class="photo-zone">
      <img src="{{PHOTO_URL}}" alt="">
    </div>
    <div class="text-zone">
      <div class="headline-col">
        <div class="headline">{{HEADLINE}}</div>
      </div>
      <div class="body-col">
        <div class="body">{{BODY}}</div>
        <div class="cta-btn">Leia o post ↗</div>
      </div>
    </div>
    <div class="handle">@jotabernardO</div>
  </div>
</body>
</html>
