<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body, html { margin: 0; padding: 0; }
    #slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
    }
    .photo-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 540px;
      overflow: hidden;
    }
    .photo-top img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 15%;
      filter: brightness(0.75) saturate(0.85);
    }
    .photo-bottom {
      position: absolute;
      top: 540px; left: 0; right: 0;
      height: 540px;
      overflow: hidden;
    }
    .photo-bottom img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 70%;
      filter: brightness(0.6) saturate(0.8);
    }
    .seam-overlay {
      position: absolute;
      top: 390px;
      left: 0; right: 0;
      height: 300px;
      background: linear-gradient(to bottom,
        rgba(10,15,30,0.0) 0%,
        rgba(10,15,30,0.7) 50%,
        rgba(10,15,30,0.0) 100%);
    }
    .headline {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 76px;
      line-height: 1.1;
      color: #ffffff;
      text-shadow: 0 3px 24px rgba(0,0,0,0.6);
      letter-spacing: -1px;
    }
    .body-zone {
      position: absolute;
      bottom: 48px;
      left: 0; right: 0;
      text-align: center;
      padding: 0 100px;
    }
    .body-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      line-height: 1.6;
      color: rgba(255,255,255,0.72);
      text-shadow: 0 1px 8px rgba(0,0,0,0.5);
    }
    .handle {
      position: absolute;
      bottom: 18px;
      right: 44px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.32);
    }
  </style>
</head>
<body>
  <div id="slide">
    <div class="photo-top"><img src="{{PHOTO_URL}}" alt=""></div>
    <div class="photo-bottom"><img src="{{PHOTO_URL}}" alt=""></div>
    <div class="seam-overlay"></div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="body-zone">
      <div class="body-text">{{BODY}}</div>
    </div>
    <div class="handle">@jotabernardO</div>
  </div>
</body>
</html>
