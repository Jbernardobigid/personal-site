<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body, html { margin: 0; padding: 0; }
    #slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #F0EAE0;
      display: flex;
    }
    .left-col {
      width: 420px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .rotated-wrap {
      transform: rotate(-90deg);
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .rotated-headline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 60px;
      color: #1E2B4A;
      letter-spacing: -0.5px;
    }
    .rotated-body {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(30,43,74,0.45);
    }
    .accent-line {
      position: absolute;
      right: 0;
      top: 80px; bottom: 80px;
      width: 3px;
      background: #C8A96E;
    }
    .right-col {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .right-col img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: brightness(0.85) saturate(0.9);
    }
    .badge {
      position: absolute;
      top: 52px;
      right: 52px;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 1.5px solid rgba(200,169,110,0.55);
      background: rgba(240,234,224,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      text-align: center;
      line-height: 1.6;
    }
    .handle {
      position: absolute;
      bottom: 20px;
      right: 24px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div id="slide">
    <div class="left-col">
      <div class="rotated-wrap">
        <div class="rotated-headline">{{HEADLINE}}</div>
        <div class="rotated-body">{{BODY}}</div>
      </div>
      <div class="accent-line"></div>
    </div>
    <div class="right-col">
      <img src="{{PHOTO_URL}}" alt="">
      <div class="badge">
        <div class="badge-text">Jorge<br>Bernardo</div>
      </div>
      <div class="handle">@jotabernardO</div>
    </div>
  </div>
</body>
</html>
