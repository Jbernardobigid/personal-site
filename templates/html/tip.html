<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body, html { margin: 0; padding: 0; }
    #slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #6B3A1E;
    }
    .handle-left {
      position: absolute;
      top: 50%;
      left: 22px;
      transform: translateY(-50%) rotate(-90deg);
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      white-space: nowrap;
    }
    .handle-right {
      position: absolute;
      top: 50%;
      right: 22px;
      transform: translateY(-50%) rotate(90deg);
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      white-space: nowrap;
    }
    .card {
      position: absolute;
      top: 74px;
      left: 80px;
      right: 80px;
      bottom: 74px;
      background: #EDE5D8;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 70px 52px;
      box-sizing: border-box;
    }
    .label {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #8B5E3C;
      margin-bottom: 28px;
    }
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 62px;
      line-height: 1.12;
      color: #2C1A0E;
      text-align: center;
      margin-bottom: 32px;
      letter-spacing: -0.5px;
    }
    .divider {
      width: 40px;
      height: 1.5px;
      background: #A06840;
      margin-bottom: 30px;
      flex-shrink: 0;
    }
    .body {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      line-height: 1.55;
      color: #4A2C18;
      text-align: center;
    }
    .cta {
      margin-top: 36px;
      padding-top: 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8B5E3C;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cta::after {
      content: '→';
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="slide">
    <div class="handle-left">@jotabernardO</div>
    <div class="handle-right">@jotabernardO</div>
    <div class="card">
      <div class="label">Dica</div>
      <div class="headline">{{HEADLINE}}</div>
      <div class="divider"></div>
      <div class="body">{{BODY}}</div>
      <div class="cta">Leia o post completo</div>
    </div>
  </div>
</body>
</html>
