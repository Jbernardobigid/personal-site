<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
  body{
    font-family:'Fraunces',serif;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 88px 470px;
    position:relative;
  }
  /* Scrim. Without it the headline lands on whatever the pan happens to be
     over (usually a statue's face) and fights the artwork. Anchored to the
     bottom so the top half of the diptych stays untouched. */
  body::before{
    content:"";position:absolute;left:0;right:0;bottom:0;height:62%;
    background:linear-gradient(to top,
      rgba(10,8,6,.93) 0%,
      rgba(10,8,6,.86) 22%,
      rgba(10,8,6,.62) 48%,
      rgba(10,8,6,.28) 72%,
      rgba(10,8,6,0) 100%);
    z-index:-1;
  }
  .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:30px;font-weight:600;
    letter-spacing:.26em;text-transform:uppercase;
    color:#c6a02f;
    margin-bottom:26px;
    display:flex;align-items:center;gap:20px;
  }
  .label::before{content:"";width:64px;height:2px;background:#c6a02f;display:block}
  .headline{
    font-size:96px;font-weight:700;line-height:1.02;letter-spacing:-.02em;
    color:#f1e7d6;
    text-shadow:0 4px 40px rgba(0,0,0,.95), 0 2px 10px rgba(0,0,0,.9);
    text-wrap:balance;
  }
  .headline em{font-style:italic;font-weight:600;color:#c1532f}
</style>
</head>
<body>
  <div class="label">{{LABEL}}</div>
  <div class="headline">{{HEADLINE}}</div>
</body>
</html>
